# UNUSED by the current stack. This config was for the zepai/knowledge-graph-mcp
# image, which has been replaced by the zepai/graphiti REST server. The REST
# server reads its LLM/embedder config from env (set in compose.yml) and the
# Ollama-compatible client is injected by graphiti/bootstrap.py. This file is
# kept for reference only; it is NOT mounted into the container.
#
# Original purpose (MCP image): LLM and embedder both pointed at the host
# Ollama via its OpenAI-compatible /v1. Mounted read-only at
# /app/mcp/config/config.yaml inside the graphiti-mcp container.

server:
  transport: "http"
  host: "0.0.0.0"
  port: 8000

llm:
  provider: "openai"
  model: ${MODEL_NAME:qwen2.5:14b}
  max_tokens: 4096
  structured_output_mode: ${LLM_STRUCTURED_OUTPUT_MODE:json_object}
  providers:
    openai:
      api_key: ${OPENAI_API_KEY:ollama}
      api_url: ${OPENAI_API_URL:http://host.docker.internal:11434/v1}
      organization_id: ${OPENAI_ORGANIZATION_ID:}

embedder:
  provider: "openai"
  model: ${EMBEDDER_MODEL:nomic-embed-text}
  dimensions: ${EMBEDDER_DIMENSIONS:768}
  providers:
    openai:
      api_key: ${OPENAI_API_KEY:ollama}
      api_url: ${OPENAI_API_URL:http://host.docker.internal:11434/v1}
      organization_id: ${OPENAI_ORGANIZATION_ID:}

database:
  provider: "neo4j"
  providers:
    neo4j:
      uri: ${NEO4J_URI:bolt://neo4j:7687}
      username: ${NEO4J_USER:neo4j}
      password: ${NEO4J_PASSWORD:password}
      database: ${NEO4J_DATABASE:neo4j}
      use_parallel_runtime: ${USE_PARALLEL_RUNTIME:false}

graphiti:
  group_id: ${GRAPHITI_GROUP_ID:main}
  episode_id_prefix: ${EPISODE_ID_PREFIX:}
  user_id: ${USER_ID:mcp_user}
  entity_types:
    - name: "Preference"
      description: "User preferences, choices, opinions, or selections (prioritize over most other types except User/Assistant)"
    - name: "Requirement"
      description: "Specific needs, features, or functionality that must be fulfilled"
    - name: "Procedure"
      description: "Standard operating procedures and sequential instructions"
    - name: "Location"
      description: "Physical or virtual places where activities occur"
    - name: "Event"
      description: "Time-bound activities, occurrences, or experiences"
    - name: "Organization"
      description: "Companies, institutions, groups, or formal entities"
    - name: "Document"
      description: "Information content in various forms (books, articles, reports, etc.)"
    - name: "Topic"
      description: "Subject of conversation, interest, or knowledge domain (use as last resort)"
    - name: "Object"
      description: "Physical items, tools, devices, or possessions (use as last resort)"