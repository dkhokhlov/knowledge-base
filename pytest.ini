[pytest]
# Regular pytest collection: every tests/test_*.py is a test module.
#   - tests/test_runner.py is ONE runner with one test function per bash script
#     (tests/test_*.sh + scripts/test-e2e-iso.sh). Each function carries an
#     in-file @pytest.mark.<group> (integration/e2e, with long stacked) and
#     runs its script via the run_sh fixture (tests/conftest.py).
#   - The python unit tests (tests/test_gateway_unit.py, test_kb_check.py,
#     test_offset_aware_chunking.py, test_output_json.py) are stdlib
#     unittest.TestCase modules, collected natively; tests/conftest.py marks
#     their items `unit`.
# The .sh files are not python, so pytest never collects them directly.
testpaths = tests
addopts = -ra --strict-markers
markers =
    unit: python unit tests (no stack needed; stdlib unittest.TestCase)
    integration: bash system tests against the live stack (run: make start first)
    e2e: isolated e2e tests that self-clone a throwaway stack via scripts/lib-e2e-env.sh
    long: long-running tests (real-corpus drains, at-scale e2e); cross-cutting tag