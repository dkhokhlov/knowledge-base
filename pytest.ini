[pytest]
# Regular pytest collection: every tests/test_*.py is a test module.
#   - tests/test_runner.py is ONE runner with one test function per bash script
#     (tests/test_*.sh). Each function carries an
#     in-file @pytest.mark.<group> (integration/iso, with shared/long stacked)
#     and runs its script via a fixture (tests/conftest.py):
#       run_sh      -- live stack (integration, test_01/02/03).
#       iso_env     -- session-shared clean-prod stack (iso+shared, 9 tests).
#       iso_env_named -- a named own-iso stack (iso+long / iso single).
#   - The python unit tests (tests/test_gateway_unit.py, test_kb_check.py,
#     test_offset_aware_chunking.py, test_output_json.py) are stdlib
#     unittest.TestCase modules, collected natively; tests/conftest.py marks
#     their items `unit`.
# The .sh files are not python, so pytest never collects them directly.
testpaths = tests
addopts = -ra --strict-markers
markers =
    unit: python unit tests (no stack needed; stdlib unittest.TestCase)
    integration: live stack read-only system tests (test_01/02/03; run: make start first)
    iso: isolated tests against a throwaway clean-prod stack (session-shared via iso_env, or a named own-iso stack via iso_env_named; scripts/lib-e2e-env.sh)
    shared: cross-cutting tag on the iso tests that share ONE session-provisioned stack (test_04/05/06/07/10/11/13/14/15)
    long: long-running tests (real-corpus drains, at-scale); cross-cutting tag