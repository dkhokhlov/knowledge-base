# KnowledgeBase stack: Graphiti MCP (HTTP, gated by Caddy) + Neo4j (internal) +
# Open WebUI (HTTP+REST, exposed). Ollama is EXTERNAL on the Docker host,
# reached via the host-gateway. All persistent state lives under ./data
# (bind mounts, NOT named volumes) so the whole tree can be moved to RAID
# and symlinked back. Tune everything in .env; do not edit this file.

services:
  neo4j:
    image: neo4j:${NEO4J_IMAGE_TAG:-5.26.0}
    container_name: kb-neo4j
    restart: unless-stopped
    networks: [kbnet]
    security_opt:
      - no-new-privileges:true
    # No cap_drop:ALL here — the Neo4j entrypoint needs CAP_CHOWN/DAC_OVERRIDE
    # to chown the host-owned ./data bind mount to the neo4j user on startup.
    # Container-network only. Deliberately NO `ports:` mapping.
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}
      - NEO4J_server_memory_heap_initial__size=${NEO4J_HEAP_INITIAL:-512m}
      - NEO4J_server_memory_heap_max__size=${NEO4J_HEAP_MAX:-1G}
      - NEO4J_server_memory_pagecache_size=${NEO4J_PAGECACHE:-512m}
    volumes:
      - ${DATA_ROOT:-./data}/neo4j/data:/data
      - ${DATA_ROOT:-./data}/neo4j/logs:/logs
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  graphiti-mcp:
    image: zepai/knowledge-graph-mcp:${GRAPHITI_IMAGE_TAG:-standalone}
    container_name: kb-graphiti-mcp
    restart: unless-stopped
    networks: [kbnet]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      neo4j:
        condition: service_healthy
    # Internal-only. Reached via the graphiti-gateway (Caddy). NO `ports:`.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
      - .env.local
    environment:
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
      - GRAPHITI_GROUP_ID=${GRAPHITI_GROUP_ID:-main}
      - SEMAPHORE_LIMIT=${SEMAPHORE_LIMIT:-3}
      - CONFIG_PATH=/app/mcp/config/config.yaml
      - MODEL_NAME=${MODEL_NAME:-qwen2.5:14b}
      - OPENAI_API_KEY=ollama
      - OPENAI_API_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}/v1
      - EMBEDDER_MODEL=${EMBEDDER_MODEL:-nomic-embed-text}
      - EMBEDDER_DIMENSIONS=${EMBEDDER_DIMENSIONS:-768}
      - LLM_STRUCTURED_OUTPUT_MODE=${LLM_STRUCTURED_OUTPUT_MODE:-json_object}
      - GRAPHITI_TELEMETRY_ENABLED=false
    volumes:
      - ./graphiti/config.yaml:/app/mcp/config/config.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  graphiti-gateway:
    image: caddy:2-alpine
    container_name: kb-graphiti-gateway
    restart: unless-stopped
    networks: [kbnet]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      graphiti-mcp:
        condition: service_healthy
    ports:
      - "${GRAPHITI_HOST_PORT:-8000}:8000"
    env_file:
      - .env
      - .env.local
    # GRAPHITI_API_TOKEN is injected by env_file (.env.local); the non-empty
    # guard lives in the Makefile `start` target so down/stop/clear stay robust.
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  openwebui:
    image: ghcr.io/open-webui/open-webui:${OPENWEBUI_IMAGE_TAG:-main}
    container_name: kb-openwebui
    restart: unless-stopped
    networks: [kbnet]
    security_opt:
      - no-new-privileges:true
    # No cap_drop:ALL here — Open WebUI writes to the host-owned ./data bind
    # mount and needs DAC_OVERRIDE to do so as root.
    ports:
      - "${OPENWEBUI_HOST_PORT:-3000}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
      - .env.local
    environment:
      - WEBUI_AUTH=true
      - ENABLE_SIGNUP=${ENABLE_SIGNUP:-true}
      - DEFAULT_USER_ROLE=${DEFAULT_USER_ROLE:-pending}
      - ENV=${ENV:-dev}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - RAG_EMBEDDING_ENGINE=ollama
      - RAG_EMBEDDING_MODEL=${RAG_EMBEDDING_MODEL:-nomic-embed-text}
      # --- Attack-surface reduction (defaults locked to False; see .env) ---
      - USER_PERMISSIONS_WORKSPACE_TOOLS_ACCESS=${USER_PERMISSIONS_WORKSPACE_TOOLS_ACCESS:-False}
      - USER_PERMISSIONS_WORKSPACE_TOOLS_IMPORT=${USER_PERMISSIONS_WORKSPACE_TOOLS_IMPORT:-False}
      - USER_PERMISSIONS_WORKSPACE_SKILLS_ACCESS=${USER_PERMISSIONS_WORKSPACE_SKILLS_ACCESS:-False}
      - USER_PERMISSIONS_WORKSPACE_SKILLS_IMPORT=${USER_PERMISSIONS_WORKSPACE_SKILLS_IMPORT:-False}
      - USER_PERMISSIONS_FEATURES_DIRECT_TOOL_SERVERS=${USER_PERMISSIONS_FEATURES_DIRECT_TOOL_SERVERS:-False}
      - USER_PERMISSIONS_FEATURES_WEB_SEARCH=${USER_PERMISSIONS_FEATURES_WEB_SEARCH:-False}
      - ENABLE_OPENAI_API=${ENABLE_OPENAI_API:-False}
      - ENABLE_WEB_SEARCH=${ENABLE_WEB_SEARCH:-False}
      - ENABLE_COMMUNITY_SHARING=${ENABLE_COMMUNITY_SHARING:-False}
      - ENABLE_EVALUATION_ARENA_MODELS=${ENABLE_EVALUATION_ARENA_MODELS:-False}
    volumes:
      - ${DATA_ROOT:-./data}/openwebui:/app/backend/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

networks:
  kbnet:
    driver: bridge