# KnowledgeBase stack: kb-gateway (authz + Graphiti MCP bridge, behind Caddy) +
# Graphiti MCP + Neo4j (internal-only) + Open WebUI (HTTP+REST, exposed).
# Ollama is EXTERNAL on the Docker host, reached via the host-gateway. All
# persistent state lives under ./data (bind mounts, NOT named volumes) so the
# whole tree can be moved to RAID and symlinked back. Tune in .env; do not
# edit this file.
#
# Networks (codex #1): graphiti-mcp + neo4j live on graph_internal and are
# reachable ONLY by kb-gateway. Caddy (edge) is the public face and proxies to
# kb-gateway, which is the sole bridge to graphiti-mcp/neo4j (graph_internal)
# and OWUI (owui_net). Agents authenticate with KB_API_KEY (an Open WebUI key);
# identity + role are derived by the gateway from that key (tamper-proof).

services:
  neo4j:
    image: neo4j:${NEO4J_IMAGE_TAG:-5.26.0}
    container_name: kb-neo4j
    restart: unless-stopped
    networks: [graph_internal]
    security_opt:
      - no-new-privileges:true
    # No cap_drop:ALL here — the Neo4j entrypoint needs CAP_CHOWN/DAC_OVERRIDE
    # to chown the host-owned ./data bind mount to the neo4j user on startup.
    # Internal to graph_internal only. Deliberately NO `ports:` mapping; the
    # kb-gateway is the sole bridge to it (group discovery + delete guards).
    environment:
      - NEO4J_AUTH=${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}
      - NEO4J_server_memory_heap_initial__size=${NEO4J_HEAP_INITIAL:-512m}
      - NEO4J_server_memory_heap_max__size=${NEO4J_HEAP_MAX:-1G}
      - NEO4J_server_memory_pagecache_size=${NEO4J_PAGECACHE:-512m}
    volumes:
      - ${DATA_ROOT:-./data}/neo4j/data:/data
      - ${DATA_ROOT:-./data}/neo4j/logs:/logs
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  graphiti-mcp:
    image: zepai/knowledge-graph-mcp:${GRAPHITI_IMAGE_TAG:-standalone}
    container_name: kb-graphiti-mcp
    restart: unless-stopped
    networks: [graph_internal]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      neo4j:
        condition: service_healthy
    # Internal to graph_internal only. Reached only by kb-gateway (which does
    # the MCP handshake + authz). NO `ports:`; no longer exposed by Caddy.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
      - .env.local
    environment:
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
      - GRAPHITI_GROUP_ID=${GRAPHITI_GROUP_ID:-main}
      - SEMAPHORE_LIMIT=${SEMAPHORE_LIMIT:-3}
      - CONFIG_PATH=/app/mcp/config/config.yaml
      - MODEL_NAME=${MODEL_NAME:-qwen2.5:14b}
      - OPENAI_API_KEY=ollama
      - OPENAI_API_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}/v1
      - EMBEDDER_MODEL=${EMBEDDER_MODEL:-nomic-embed-text}
      - EMBEDDER_DIMENSIONS=${EMBEDDER_DIMENSIONS:-768}
      - LLM_STRUCTURED_OUTPUT_MODE=${LLM_STRUCTURED_OUTPUT_MODE:-json_object}
      - GRAPHITI_TELEMETRY_ENABLED=false
    volumes:
      - ./graphiti/config.yaml:/app/mcp/config/config.yaml:ro
    healthcheck:
      # curl, not wget: the zepai/knowledge-graph-mcp image has no wget.
      test: ["CMD", "curl", "-fs", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  graphiti-gateway:
    image: caddy:2-alpine
    container_name: kb-graphiti-gateway
    restart: unless-stopped
    networks: [edge]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # caddy:2-alpine ships /usr/bin/caddy with the cap_net_bind_service file
    # capability. cap_drop:ALL clears the bounding set, so the kernel refuses
    # to exec the binary ("operation not permitted"). Add NET_BIND_SERVICE back
    # so exec succeeds; it is unused (we bind :8000, an unprivileged port).
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      kb-gateway:
        condition: service_healthy
    ports:
      - "${GRAPHITI_HOST_PORT:-8000}:8000"
    # Caddy is the public edge. It proxies to kb-gateway (edge net), which is
    # the sole bridge to graphiti-mcp + neo4j (graph_internal) and OWUI
    # (owui_net). No GRAPHITI_API_TOKEN anymore — the gateway authorizes via
    # KB_API_KEY (validated against Open WebUI).
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  kb-gateway:
    # Stack-side authorization + Graphiti MCP bridge + admin user provisioning.
    # Zero-dependency Python stdlib service. The ONLY bridge between the edge
    # (Caddy) and graphiti-mcp/neo4j (graph_internal) + OWUI (owui_net). No host
    # port: agents reach it through Caddy on ${GRAPHITI_HOST_PORT}.
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: kb-kb-gateway
    restart: unless-stopped
    networks: [graph_internal, edge, owui_net]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      neo4j:
        condition: service_healthy
      graphiti-mcp:
        condition: service_healthy
      openwebui:
        condition: service_healthy
    environment:
      - OWUI_URL=http://openwebui:8080
      - GRAPHITI_MCP_URL=http://graphiti-mcp:8000
      - NEO4J_URL=http://neo4j:7474
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-password}
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
      - KB_GATEWAY_PORT=8010
      - KB_MAX_CONCURRENCY=${KB_MAX_CONCURRENCY:-16}
    # No data mounts: the gateway is stateless (config via env only).
    healthcheck:
      # python:3-slim has no curl/wget — use the stdlib (codex #7). /health
      # reflects the OWUI identity dependency (codex #8).
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8010/health',timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  openwebui:
    image: ghcr.io/open-webui/open-webui:${OPENWEBUI_IMAGE_TAG:-main}
    container_name: kb-openwebui
    restart: unless-stopped
    networks: [owui_net]
    security_opt:
      - no-new-privileges:true
    # No cap_drop:ALL here — Open WebUI writes to the host-owned ./data bind
    # mount and needs DAC_OVERRIDE to do so as root.
    ports:
      - "${OPENWEBUI_HOST_PORT:-3000}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
      - .env.local
    environment:
      - WEBUI_AUTH=true
      - ENABLE_SIGNUP=${ENABLE_SIGNUP:-true}
      - DEFAULT_USER_ROLE=${DEFAULT_USER_ROLE:-pending}
      - ENV=${ENV:-dev}
      - ENABLE_API_KEYS=${ENABLE_API_KEYS:-true}
      - USER_PERMISSIONS_FEATURES_API_KEYS=${USER_PERMISSIONS_FEATURES_API_KEYS:-true}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - RAG_EMBEDDING_ENGINE=ollama
      - RAG_EMBEDDING_MODEL=${RAG_EMBEDDING_MODEL:-nomic-embed-text}
      # --- Attack-surface reduction (defaults locked to False; see .env) ---
      - USER_PERMISSIONS_WORKSPACE_TOOLS_ACCESS=${USER_PERMISSIONS_WORKSPACE_TOOLS_ACCESS:-False}
      - USER_PERMISSIONS_WORKSPACE_TOOLS_IMPORT=${USER_PERMISSIONS_WORKSPACE_TOOLS_IMPORT:-False}
      - USER_PERMISSIONS_WORKSPACE_SKILLS_ACCESS=${USER_PERMISSIONS_WORKSPACE_SKILLS_ACCESS:-False}
      - USER_PERMISSIONS_WORKSPACE_SKILLS_IMPORT=${USER_PERMISSIONS_WORKSPACE_SKILLS_IMPORT:-False}
      - USER_PERMISSIONS_FEATURES_DIRECT_TOOL_SERVERS=${USER_PERMISSIONS_FEATURES_DIRECT_TOOL_SERVERS:-False}
      - USER_PERMISSIONS_FEATURES_WEB_SEARCH=${USER_PERMISSIONS_FEATURES_WEB_SEARCH:-False}
      - ENABLE_OPENAI_API=${ENABLE_OPENAI_API:-False}
      - ENABLE_WEB_SEARCH=${ENABLE_WEB_SEARCH:-False}
      - ENABLE_COMMUNITY_SHARING=${ENABLE_COMMUNITY_SHARING:-False}
      - ENABLE_EVALUATION_ARENA_MODELS=${ENABLE_EVALUATION_ARENA_MODELS:-False}
      # --- Phone-home / outbound hardening (defaults in .env) ---
      - ENABLE_VERSION_UPDATE_CHECK=${ENABLE_VERSION_UPDATE_CHECK:-False}
      - ENABLE_OTEL=${ENABLE_OTEL:-False}
      - WEBUI_FAVICON_URL=${WEBUI_FAVICON_URL:-/static/favicon.png}
    volumes:
      - ${DATA_ROOT:-./data}/openwebui:/app/backend/data
      # Mount the custom favicon over the build SOURCE (not the served path): the
      # Open WebUI startup sync copies FRONTEND_BUILD_DIR/static/* into STATIC_DIR
      # on every start, so mounting the source lets the sync copy our icon in
      # cleanly. :ro avoids log noise (the sync never writes back here).
      - ./docs/xgensilicon.png:/app/build/static/favicon.png:ro
      - ./docs/xgensilicon.ico:/app/build/static/favicon.ico:ro
    healthcheck:
      # curl, not wget: the open-webui image has no wget.
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

networks:
  # graphiti-mcp + neo4j are internal-only: reachable only by kb-gateway, never
  # by Caddy/OWUI/each other's attackers (codex #1). kb-gateway is the sole bridge.
  graph_internal:
    driver: bridge
  # Public edge: Caddy (proxies agents to kb-gateway).
  edge:
    driver: bridge
  # Open WebUI + kb-gateway (identity resolution).
  owui_net:
    driver: bridge