# KnowledgeBase stack: Caddy (single public edge = KB_HOST) fronting api-gateway
# (authz + Graphiti REST bridge) + Open WebUI (HTTP+REST), plus the Graphiti
# REST server + Neo4j (internal-only). Ollama is EXTERNAL on the Docker host,
# reached via the host-gateway. All persistent state lives under ./data (bind
# mounts, NOT named volumes) so the whole tree can be moved to RAID and
# symlinked back. Tune in .env; do not edit this file.
#
# Networks (codex #1): graphiti + neo4j live on graph_internal and are
# reachable ONLY by api-gateway. Caddy (edge + owui_net) is the single public
# face (KB_HOST): /memory/*, POST /admin/users, /health -> api-gateway;
# everything else -> Open WebUI (the KB_HOST root landing page). api-gateway is
# the sole bridge to graphiti/neo4j (graph_internal) and OWUI (owui_net).
# Agents authenticate with KB_API_KEY (an Open WebUI key); identity + role are
# derived by the gateway from that key (tamper-proof).

services:
  neo4j:
    image: neo4j:${NEO4J_IMAGE_TAG:?NEO4J_IMAGE_TAG required in .env}
    container_name: kb-neo4j
    restart: unless-stopped
    networks: [graph_internal]
    security_opt:
      - no-new-privileges:true
    # No cap_drop:ALL here — the Neo4j entrypoint needs CAP_CHOWN/DAC_OVERRIDE
    # to chown the host-owned ./data bind mount to the neo4j user on startup.
    # Internal to graph_internal only. Deliberately NO `ports:` mapping; the
    # api-gateway is the sole bridge to it (group discovery + delete guards).
    environment:
      - NEO4J_AUTH=${NEO4J_USER:?NEO4J_USER required in .env}/${NEO4J_PASSWORD:?NEO4J_PASSWORD required in .env}
      - NEO4J_server_memory_heap_initial__size=${NEO4J_HEAP_INITIAL:?NEO4J_HEAP_INITIAL required in .env}
      - NEO4J_server_memory_heap_max__size=${NEO4J_HEAP_MAX:?NEO4J_HEAP_MAX required in .env}
      - NEO4J_server_memory_pagecache_size=${NEO4J_PAGECACHE:?NEO4J_PAGECACHE required in .env}
    volumes:
      - ${DATA_ROOT:?DATA_ROOT required in .env}/neo4j/data:/data
      - ${DATA_ROOT:?DATA_ROOT required in .env}/neo4j/logs:/logs
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    # pgvector-enabled Postgres: the Open WebUI vector store (VECTOR_DB=pgvector).
    # Replaces the embedded Chroma store so retrieval can use server-side BM25
    # full-text search (to_tsvector('simple', ...) + a GIN index) next to the
    # vector index. Open WebUI creates the extension, the document_chunk table,
    # the vector index, and the FTS index at client init, so no init SQL is
    # needed here. This holds VECTORS ONLY; webui.db (SQLite) stays the app DB.
    image: pgvector/pgvector:${PGVECTOR_IMAGE_TAG:?PGVECTOR_IMAGE_TAG required in .env}
    container_name: kb-postgres
    restart: unless-stopped
    networks: [owui_net]
    security_opt:
      - no-new-privileges:true
    # No cap_drop:ALL here — the Postgres entrypoint needs CAP_CHOWN/DAC_OVERRIDE
    # to chown the host-owned ./data bind mount to the postgres user on startup
    # (same reason as neo4j above).
    # Internal to owui_net only. Deliberately NO `ports:` mapping; Open WebUI is
    # the sole client.
    environment:
      - POSTGRES_USER=${PGVECTOR_USER:?PGVECTOR_USER required in .env}
      - POSTGRES_PASSWORD=${PGVECTOR_PASSWORD:?PGVECTOR_PASSWORD required in .env}
      - POSTGRES_DB=${PGVECTOR_DB:?PGVECTOR_DB required in .env}
    volumes:
      - ${DATA_ROOT:?DATA_ROOT required in .env}/postgres:/var/lib/postgresql/data
    healthcheck:
      # Bare ${PGVECTOR_USER}/${PGVECTOR_DB} (no :?) inside CMD-SHELL: the
      # environment block above already fails loud on a missing value, and a :?
      # inside a CMD-SHELL string is ambiguous between compose and shell.
      test: ["CMD-SHELL", "pg_isready -U ${PGVECTOR_USER} -d ${PGVECTOR_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  graphiti:
    # graphiti REST server (graph_service FastAPI app). The image's default
    # Graphiti client uses OpenAIClient (OpenAI Responses API), which Ollama
    # cannot satisfy (extraction silently stores nothing). graphiti/bootstrap.py
    # is mounted and run as the command; it rebuilds the app with a dependency
    # override that injects OpenAIGenericClient (Chat Completions + json_schema
    # structured outputs, the >= 0.29 default) + the nomic embedder @ 768, so
    # Ollama extraction works. See graphiti/bootstrap.py.
    image: ghcr.io/dkhokhlov/graphiti-rest:${GRAPHITI_IMAGE_TAG:?GRAPHITI_IMAGE_TAG required in .env}
    container_name: kb-graphiti
    restart: unless-stopped
    networks: [graph_internal]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      neo4j:
        condition: service_healthy
    # Internal to graph_internal only. Reached only by api-gateway (which does
    # the authz). NO `ports:`; not exposed by Caddy.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Override Docker's forced ndots:0 so bare OLLAMA_HOST (<ollama-host>) is resolved
    # search-first (<ollama-host>.<domain>) instead of absolute-first, which
    # sent a wasted bare `<ollama-host>.` NXDOMAIN upstream to the router on every
    # resolution. Verified: dns_opt overrides the internal ndots:0 cleanly.
    dns_opt: [ndots:1]
    env_file:
      - .env
      - .env.local
    environment:
      - NEO4J_URI=${NEO4J_URI:?NEO4J_URI required in .env}
      - NEO4J_USER=${NEO4J_USER:?NEO4J_USER required in .env}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?NEO4J_PASSWORD required in .env}
      # The REST server reads these via graph_service.config.Settings:
      - OPENAI_API_KEY=ollama
      - OPENAI_BASE_URL=${OLLAMA_HOST:?OLLAMA_HOST is required (shell env or uncomment in .env)}/v1
      # graphiti_core reads its native MODEL_NAME container var; compose maps it
      # from .env GRAPHITI_MODEL (the ctx-baked extraction LLM, qwen2.5:14b-ctx8192).
      # :? (no fallback) fails loud on a missing .env instead of silently loading
      # the stock 32k model (~53 GB, spills to CPU). See .env "LLM model".
      - MODEL_NAME=${GRAPHITI_MODEL:?GRAPHITI_MODEL required in .env}
      - EMBEDDING_MODEL_NAME=${EMBEDDER_MODEL:?EMBEDDER_MODEL required in .env}
      # Not a REST Settings field; the bootstrap reads it to set the embedder
      # dim (and thus the vector index dim). 768 = nomic-embed-text.
      - EMBEDDER_DIMENSIONS=${EMBEDDER_DIMENSIONS:?EMBEDDER_DIMENSIONS required in .env}
      # graphiti_core itself still reads SEMAPHORE_LIMIT (extraction concurrency).
      - SEMAPHORE_LIMIT=${SEMAPHORE_LIMIT:?SEMAPHORE_LIMIT required in .env}
      - GRAPHITI_TELEMETRY_ENABLED=false
      - LOG_LEVEL=${LOG_LEVEL:?LOG_LEVEL required in .env}
    volumes:
      - ./graphiti/bootstrap.py:/app/bootstrap.py:ro
      - ./scripts/ollama-host.sh:/app/ollama-host.sh:ro
    # Translate OLLAMA_HOST localhost/127.0.0.1 -> host.docker.internal before
    # bootstrap.py reads OPENAI_BASE_URL. The image ENTRYPOINT is null, so this
    # shim is safe to set; it execs "$@" = the command below. See the shim header
    # (scripts/ollama-host.sh). OWUI is NOT wrapped here: it persists
    # rag.ollama.base_url to its DB on first boot, so `make rag-config` writes the
    # translated value to that DB instead.
    entrypoint: ["/app/ollama-host.sh"]
    command: ["python", "/app/bootstrap.py"]
    healthcheck:
      # The uv-based image has no curl/wget; use the stdlib. /healthcheck only
      # proves the FastAPI process is up (Neo4j health is the gateway's check).
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthcheck',timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  proxy:
    image: caddy:2-alpine
    container_name: kb-proxy
    restart: unless-stopped
    networks: [edge, owui_net]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # caddy:2-alpine ships /usr/bin/caddy with the cap_net_bind_service file
    # capability. cap_drop:ALL clears the bounding set, so the kernel refuses
    # to exec the binary ("operation not permitted"). Add NET_BIND_SERVICE back
    # so exec succeeds; it is unused (we bind :3000, an unprivileged port).
    cap_add:
      - NET_BIND_SERVICE
    # service_started (not service_healthy) so the OWUI root stays reachable
    # even when api-gateway is broken/slow — the gateway's own /health already
    # reflects OWUI, and OWUI does not depend on the gateway.
    depends_on:
      openwebui:
        condition: service_started
      api-gateway:
        condition: service_started
    ports:
      - "${KB_HOST_PORT:?KB_HOST_PORT required -- run make bootstrap (derives it from KB_HOST)}:3000"
    # Caddy is the public edge (single URL = KB_HOST). /memory/*, POST
    # /admin/users, and /health -> api-gateway (edge net); everything else ->
    # openwebui:8080 (owui_net). The gateway authorizes via KB_API_KEY
    # (validated against Open WebUI). See caddy/Caddyfile.
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  api-gateway:
    # Stack-side authorization + Graphiti REST bridge + admin user provisioning.
    # Zero-dependency Python stdlib service. The ONLY bridge between the edge
    # (Caddy) and graphiti/neo4j (graph_internal) + OWUI (owui_net). No host
    # port: agents reach it through Caddy on ${KB_HOST_PORT}.
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: kb-api-gateway
    restart: unless-stopped
    # Run as the host owner uid so the read-only ./root bind mount
    # (0700/0600, owner-only from rclone/rsync) is readable. Non-root (just the host
    # owner uid, not root); the gateway writes nothing (stateless). Override
    # HOST_UID/HOST_GID in .env (auto-set by `make bootstrap` from the
    # current user's id -u/id -g) if the ./root owner is not the operator uid.
    user: "${HOST_UID:?HOST_UID required in .env}:${HOST_GID:?HOST_GID required in .env}"
    networks: [graph_internal, edge, owui_net]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      neo4j:
        condition: service_healthy
      graphiti:
        condition: service_healthy
      openwebui:
        condition: service_healthy
    environment:
      - OWUI_URL=http://openwebui:8080
      - GRAPHITI_URL=http://graphiti:8000
      - NEO4J_URL=http://neo4j:7474
      - NEO4J_USER=${NEO4J_USER:?NEO4J_USER required in .env}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?NEO4J_PASSWORD required in .env}
      - NEO4J_DATABASE=${NEO4J_DATABASE:?NEO4J_DATABASE required in .env}
      - KB_GATEWAY_PORT=8010
      - KB_MAX_CONCURRENCY=${KB_MAX_CONCURRENCY:?KB_MAX_CONCURRENCY required in .env}
      - LOG_LEVEL=${LOG_LEVEL:?LOG_LEVEL required in .env}
      # KB index path: the gateway holds the admin key (in docker) and
      # drives OWUI's sync protocol for /index. Caller's KB_API_KEY is
      # authorization only. dir=<name> + kb_id=<id> + KB_MAX_SIZE scope the call.
      - OPENWEBUI_ADMIN_API_KEY=${OPENWEBUI_ADMIN_API_KEY:-}
      # Chat model the gateway inserts for POST /memory/rag (the /kb skill's
      # RAG path). INDEPENDENT from GRAPHITI_MODEL (the extraction LLM): the
      # defaults are equal so one 14B instance fits the GPU, but they may differ.
      # `make api-keys` grants the agent `*` read on this model. Empty -> 503.
      - OPENWEBUI_MODEL=${OPENWEBUI_MODEL:-}
      # KB_SOURCE_ROOT: the in-container mount point of the ./root source tree.
      # Each top-level subdir is one KB; POST /index?dir=<name>&kb_id=<id> walks
      # $KB_SOURCE_ROOT/<name>. The gateway is stateless (no *_KB_ID env); name
      # resolution is the caller's job (scripts/kb-bootstrap.sh --resolve).
      - KB_SOURCE_ROOT=/kb-source
      - KB_MAX_SIZE=${KB_MAX_SIZE:?KB_MAX_SIZE required in .env}
      # /index sync-protocol call timeout (sync/diff, dirs/create, batch/add,
      # sync/cleanup, list files). The 15s identity timeout is too short for a
      # large manifest diff or a drained cleanup. Bump for a huge tree.
      - OWUI_INDEX_TIMEOUT=${OWUI_INDEX_TIMEOUT:?OWUI_INDEX_TIMEOUT required in .env}
      # POST /retrieve: forward timeout + the k bounds the route enforces.
      - OWUI_RETRIEVE_TIMEOUT=${OWUI_RETRIEVE_TIMEOUT:?OWUI_RETRIEVE_TIMEOUT required in .env}
      - KB_RETRIEVE_K_DEFAULT=${KB_RETRIEVE_K_DEFAULT:?KB_RETRIEVE_K_DEFAULT required in .env}
      - KB_RETRIEVE_K_MAX=${KB_RETRIEVE_K_MAX:?KB_RETRIEVE_K_MAX required in .env}
      - KB_MAX_QUERY=${KB_MAX_QUERY:?KB_MAX_QUERY required in .env}
    # Stateless: no persisted data. The read-only ./root mount is an INPUT
    # (source trees to index, one KB per top-level subdir), not state. The gateway
    # never writes to it.
    volumes:
      - ./root:/kb-source:ro
    healthcheck:
      # python:3-slim has no curl/wget — use the stdlib (codex #7). /health
      # reflects the OWUI identity dependency (codex #8).
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8010/health',timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  openwebui:
    # Custom overlay image: the official Open WebUI image + build-time patches
    # (KB-sync re-upload churn, retrieval ranking, reranker gating). Built
    # locally from open-webui/; see open-webui/PATCH.md for the full patch list.
    # The GHCR ref is a local tag (not pushed), so pull_policy: never — `make
    # pull` skips this service; `docker compose build openwebui` (or `make start`
    # on first run) builds it.
    image: ghcr.io/dkhokhlov/open-webui:${OPENWEBUI_IMAGE_TAG:?OPENWEBUI_IMAGE_TAG required in .env}
    build:
      context: open-webui
    pull_policy: never
    container_name: kb-openwebui
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Chroma 1.5.x (rust backend) opens a SQLite db per RAG collection. Bulk
    # ingest (api-gateway /index syncing a ./root KB tree) creates 100s of collections and
    # exhausts the default 1024 fd soft limit -> SQLITE_CANTOPEN "unable to open
    # database file" on every insert (KB file_count stays 0, uploads time out,
    # OWUI goes unhealthy). Raise nofile so collection creation under load does
    # not hit the ceiling. Hard 524288 matches the existing kernel hard limit.
    ulimits:
      nofile:
        soft: 65536
        hard: 524288
    networks: [owui_net]
    security_opt:
      - no-new-privileges:true
    # No cap_drop:ALL here — Open WebUI writes to the host-owned ./data bind
    # mount and needs DAC_OVERRIDE to do so as root.
    # No `ports:` — OWUI is internal-only on owui_net; Caddy fronts it as the
    # KB_HOST root landing page. To debug OWUI directly, use `docker exec
    # kb-openwebui ...` or a temporary `docker compose run -p 3001:8080
    # openwebui` (avoid :3000 — that is Caddy).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Override Docker's forced ndots:0 so bare OLLAMA_HOST (<ollama-host>) is resolved
    # search-first (<ollama-host>.<domain>) instead of absolute-first, which
    # sent a wasted bare `<ollama-host>.` NXDOMAIN upstream to the router on every
    # resolution. Verified: dns_opt overrides the internal ndots:0 cleanly.
    dns_opt: [ndots:1]
    env_file:
      - .env
      - .env.local
    environment:
      - WEBUI_AUTH=true
      - ENABLE_SIGNUP=${ENABLE_SIGNUP:?ENABLE_SIGNUP required in .env}
      - DEFAULT_USER_ROLE=${DEFAULT_USER_ROLE:?DEFAULT_USER_ROLE required in .env}
      - ENV=${ENV:?ENV required in .env}
      - ENABLE_API_KEYS=${ENABLE_API_KEYS:?ENABLE_API_KEYS required in .env}
      - USER_PERMISSIONS_FEATURES_API_KEYS=${USER_PERMISSIONS_FEATURES_API_KEYS:?USER_PERMISSIONS_FEATURES_API_KEYS required in .env}
      # OLLAMA_BASE_URL is the env name Open WebUI reads on first boot; the value
      # comes from the operator's OLLAMA_HOST (Ollama's native client var).
      - OLLAMA_BASE_URL=${OLLAMA_HOST:?OLLAMA_HOST is required (shell env or uncomment in .env)}
      - RAG_EMBEDDING_ENGINE=ollama
      - RAG_EMBEDDING_MODEL=${RAG_EMBEDDING_MODEL:?RAG_EMBEDDING_MODEL required in .env}
      # --- RAG embedding concurrency (startup env; herd bound) ---
      - RAG_EMBEDDING_BATCH_SIZE=${RAG_EMBEDDING_BATCH_SIZE:?RAG_EMBEDDING_BATCH_SIZE required in .env}
      - RAG_EMBEDDING_CONCURRENT_REQUESTS=${RAG_EMBEDDING_CONCURRENT_REQUESTS:?RAG_EMBEDDING_CONCURRENT_REQUESTS required in .env}
      - ENABLE_ASYNC_EMBEDDING=${ENABLE_ASYNC_EMBEDDING:?ENABLE_ASYNC_EMBEDDING required in .env}
      - THREAD_POOL_SIZE=${THREAD_POOL_SIZE:?THREAD_POOL_SIZE required in .env}
      - AIOHTTP_CLIENT_SESSION_SSL=${AIOHTTP_CLIENT_SESSION_SSL:?AIOHTTP_CLIENT_SESSION_SSL required in .env}
      - RAG_RERANKING_BATCH_SIZE=${RAG_RERANKING_BATCH_SIZE:?RAG_RERANKING_BATCH_SIZE required in .env}
      # --- Vector DB (pgvector; startup env, NOT a /retrieval/config key) ---
      - VECTOR_DB=${VECTOR_DB:?VECTOR_DB required in .env}
      - PGVECTOR_DB_URL=${PGVECTOR_DB_URL:?PGVECTOR_DB_URL required in .env}
      - PGVECTOR_CREATE_EXTENSION=${PGVECTOR_CREATE_EXTENSION:?PGVECTOR_CREATE_EXTENSION required in .env}
      - PGVECTOR_INITIALIZE_MAX_VECTOR_LENGTH=${PGVECTOR_INITIALIZE_MAX_VECTOR_LENGTH:?PGVECTOR_INITIALIZE_MAX_VECTOR_LENGTH required in .env}
      # --- Attack-surface reduction (defaults locked to False; see .env) ---
      - USER_PERMISSIONS_WORKSPACE_TOOLS_ACCESS=${USER_PERMISSIONS_WORKSPACE_TOOLS_ACCESS:?USER_PERMISSIONS_WORKSPACE_TOOLS_ACCESS required in .env}
      - USER_PERMISSIONS_WORKSPACE_TOOLS_IMPORT=${USER_PERMISSIONS_WORKSPACE_TOOLS_IMPORT:?USER_PERMISSIONS_WORKSPACE_TOOLS_IMPORT required in .env}
      - USER_PERMISSIONS_WORKSPACE_SKILLS_ACCESS=${USER_PERMISSIONS_WORKSPACE_SKILLS_ACCESS:?USER_PERMISSIONS_WORKSPACE_SKILLS_ACCESS required in .env}
      - USER_PERMISSIONS_WORKSPACE_SKILLS_IMPORT=${USER_PERMISSIONS_WORKSPACE_SKILLS_IMPORT:?USER_PERMISSIONS_WORKSPACE_SKILLS_IMPORT required in .env}
      - USER_PERMISSIONS_FEATURES_DIRECT_TOOL_SERVERS=${USER_PERMISSIONS_FEATURES_DIRECT_TOOL_SERVERS:?USER_PERMISSIONS_FEATURES_DIRECT_TOOL_SERVERS required in .env}
      - USER_PERMISSIONS_FEATURES_WEB_SEARCH=${USER_PERMISSIONS_FEATURES_WEB_SEARCH:?USER_PERMISSIONS_FEATURES_WEB_SEARCH required in .env}
      - ENABLE_OPENAI_API=${ENABLE_OPENAI_API:?ENABLE_OPENAI_API required in .env}
      - ENABLE_WEB_SEARCH=${ENABLE_WEB_SEARCH:?ENABLE_WEB_SEARCH required in .env}
      - ENABLE_COMMUNITY_SHARING=${ENABLE_COMMUNITY_SHARING:?ENABLE_COMMUNITY_SHARING required in .env}
      - ENABLE_EVALUATION_ARENA_MODELS=${ENABLE_EVALUATION_ARENA_MODELS:?ENABLE_EVALUATION_ARENA_MODELS required in .env}
      # --- Phone-home / outbound hardening (defaults in .env) ---
      - ENABLE_VERSION_UPDATE_CHECK=${ENABLE_VERSION_UPDATE_CHECK:?ENABLE_VERSION_UPDATE_CHECK required in .env}
      - ENABLE_OTEL=${ENABLE_OTEL:?ENABLE_OTEL required in .env}
      - WEBUI_FAVICON_URL=${WEBUI_FAVICON_URL:?WEBUI_FAVICON_URL required in .env}
    volumes:
      - ${DATA_ROOT:?DATA_ROOT required in .env}/openwebui:/app/backend/data
      # Mount the custom favicon over the build SOURCE (not the served path): the
      # Open WebUI startup sync copies FRONTEND_BUILD_DIR/static/* into STATIC_DIR
      # on every start, so mounting the source lets the sync copy our icon in
      # cleanly. :ro avoids log noise (the sync never writes back here).
      - ./docs/xgensilicon.png:/app/build/static/favicon.png:ro
      - ./docs/xgensilicon.ico:/app/build/static/favicon.ico:ro
    healthcheck:
      # curl, not wget: the open-webui image has no wget.
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  markitdown-ocr:
    # External extraction engine for Open WebUI: runs microsoft/markitdown-ocr
    # with the OCR service replaced by OllamaNativeOCRService (Ollama native
    # /api/chat, which applies deepseek-ocr's Gundam preprocessing; the /v1 shim
    # does not and collapses on large images). Exposes PUT /process (the OWUI
    # external-extraction contract) and returns per-page/per-slide/per-sheet
    # documents. OWUI routes EVERY ingest to it when
    # CONTENT_EXTRACTION_ENGINE=external + URL + a non-empty API key are set in
    # the OWUI DB (`make ocr-config`). See markitdown/oursvc.py + the plan.
    image: ghcr.io/dkhokhlov/markitdown-ocr:${MARKITDOWN_OCR_IMAGE_TAG:?MARKITDOWN_OCR_IMAGE_TAG required in .env}
    build:
      context: ./markitdown
    pull_policy: never
    container_name: kb-markitdown-ocr
    # Profile-gated (no-fallback). Included when COMPOSE_PROFILES=ocr in .env
    # (baked once by `make bootstrap` from OCR_ENABLED=true, default; read by
    # `docker compose` for every command), so compose builds + starts this
    # service as part of the standard chain. To disable: `make clean-all &&
    # make provision OCR_ENABLED=false` (bakes OCR_ENABLED=false + an empty
    # COMPOSE_PROFILES). OWUI routing (CONTENT_EXTRACTION_ENGINE=external +
    # URL + API key) is set in the OWUI DB by `make api-keys` (re-assert:
    # `make ocr-config`). No runtime marker; OCR_ENABLED is config, decided
    # at provision time.
    profiles: [ocr]
    restart: unless-stopped
    networks: [owui_net]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "1000:1000"
    # Starts after OWUI (it does not call OWUI; the ordering only keeps startup
    # logs linear). Reaches Ollama on the Docker host via the
    # host-gateway, the same path openwebui uses.
    depends_on:
      openwebui:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Override Docker's forced ndots:0 so bare OLLAMA_HOST (<ollama-host>) is resolved
    # search-first (<ollama-host>.<domain>) instead of absolute-first, which
    # sent a wasted bare `<ollama-host>.` NXDOMAIN upstream to the router on every
    # resolution. Verified: dns_opt overrides the internal ndots:0 cleanly.
    dns_opt: [ndots:1]
    # No env_file: only the interpolated vars below enter the container env, so
    # the rest of .env.local's secrets are NOT loaded into this sidecar.
    # OLLAMA_BASE_URL uses :? (OLLAMA_HOST is always required + always set).
    # OCR_SERVICE_TOKEN uses ${VAR:-} (NOT :?): compose interpolates ALL
    # services at parse time, even non-active profiles, and when OCR_ENABLED=false
    # no token is ever generated (bootstrap skips it) — :? would block `make
    # start` on a disabled-OCR stack. The :- default (not bare ${VAR}) keeps the
    # interpolation silent when unset, so `make stop`/`logs` (which do not source
    # .env.local) do not emit a spurious "variable is not set" warning; a stale
    # recreate that bypasses .env.local (empty token -> no /process auth) is
    # caught at RUNTIME by tests/test_10_ocr_auth.sh, which asserts the live
    # container holds a non-empty token + /process 401/200 (runs only when
    # OCR_ENABLED=true).
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_HOST:?OLLAMA_HOST is required (shell env or uncomment in .env)}
      - OCR_MODEL=${OCR_MODEL:?OCR_MODEL required in .env}
      - OCR_PROMPT=${OCR_PROMPT}
      - OCR_SERVICE_TOKEN=${OCR_SERVICE_TOKEN:-}
      - OCR_MIN_DIM=${OCR_MIN_DIM:?OCR_MIN_DIM required in .env}
      - OCR_TIMEOUT=${OCR_TIMEOUT:?OCR_TIMEOUT required in .env}
      - OCR_KEEP_ALIVE=${OCR_KEEP_ALIVE:?OCR_KEEP_ALIVE required in .env}
      - PORT=8080
      - LOG_LEVEL=${LOG_LEVEL:?LOG_LEVEL required in .env}
    # Translate OLLAMA_HOST localhost/127.0.0.1 -> host.docker.internal before
    # oursvc.py reads OLLAMA_BASE_URL. The Dockerfile ENTRYPOINT
    # ["python","/app/oursvc.py"] is moved into command: below so the shim
    # execs it. See the shim header (scripts/ollama-host.sh).
    entrypoint: ["/app/ollama-host.sh"]
    command: ["python", "/app/oursvc.py"]
    volumes:
      # Read-only code mount only (the service is stateless: config via env,
      # temp files in /tmp, unlinked). No data mounts.
      - ./scripts/ollama-host.sh:/app/ollama-host.sh:ro
    # No `ports:` — internal to owui_net only; OWUI reaches it as
    # http://markitdown-ocr:8080.
    healthcheck:
      # python:3.13-slim has no curl/wget — use the stdlib (mirror graphiti at
      # compose.yml:93 and api-gateway at compose.yml:172).
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health',timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

networks:
  # graphiti + neo4j are internal-only: reachable only by api-gateway, never
  # by Caddy/OWUI/each other's attackers (codex #1). api-gateway is the sole bridge.
  graph_internal:
    driver: bridge
  # Public edge: Caddy (proxies agents to api-gateway; also reaches OWUI below).
  edge:
    driver: bridge
  # Open WebUI + api-gateway (identity resolution) + Caddy (fronts OWUI as KB_HOST).
  owui_net:
    driver: bridge